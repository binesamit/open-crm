name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The API suite (~140 files, each booting its own PGlite and running every migration) is far longer than one
# runner can do in 15 minutes, so it is split into parallel shards; static checks and the other packages' tests
# run beside it. The final "check" job keeps the single status name ("CI / check") that branch protection uses.
jobs:
  static:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The API's typecheck outgrew Node's default ~2 GB heap (CI #156–#166: "JavaScript heap out of memory", exit
    # 134); the runner has 16 GB.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - name: Column catalog is up to date (pnpm docs:columns)
        run: pnpm docs:check
      - run: pnpm typecheck
      - run: pnpm build
      - name: Schema and migrations are in sync
        run: |
          pnpm --filter @bines/api exec drizzle-kit generate --name drift-check
          git diff --exit-code --stat apps/api/drizzle || (echo "::error::schema.ts changed without a migration (pnpm db:generate)"; exit 1)
          test -z "$(git ls-files --others --exclude-standard apps/api/drizzle)" || (echo "::error::untracked migration generated"; exit 1)

  test-packages:
    name: Tests (web, worker, packages, integrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter '!@bines/api' test

  test-api:
    name: Tests (api ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # API tests run on PGlite (in-process Postgres), no service containers needed. One worker per vCPU (4 on
      # ubuntu-latest): each file is CPU-bound WASM, more workers only make the per-test timeouts flaky.
      - run: pnpm --filter @bines/api exec vitest run --shard=${{ matrix.shard }}/6 --maxWorkers=4

  check:
    name: check
    if: always()
    needs: [static, test-packages, test-api]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a CI job did not succeed ($r)"; exit 1; }; done
