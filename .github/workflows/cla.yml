# Contributor License Agreement (CLA.md — docs/DECISIONS.md D29), via CLA Assistant Lite.
# A contributor signs once by commenting the sentence below on their pull request; signatures are kept in
# `signatures/cla.json` on the `cla-signatures` branch. DCO is not used.
#
# Runs only once the repository is public (`repository.private == false`), so it does nothing in the private
# working repo. `pull_request_target` is safe here: the job never checks out or runs the pull request's code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.repository.private == false &&
      (github.event_name == 'pull_request_target' ||
       github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/binesamit/open-crm/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],renovate[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution! Before we can merge it, please read the [Contributor License
            Agreement](https://github.com/binesamit/open-crm/blob/main/CLA.md) and sign it by commenting the sentence below
            on this pull request. You only need to do this once.
