name: Security

# Security review S-CI (docs/SECURITY-REVIEW.md, roadmap ס5): dependency audit, static analysis and secret scanning
# on every push and PR; the passive ZAP baseline against staging runs on demand only (never against production).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      zap:
        description: Run the passive OWASP ZAP baseline against staging
        type: boolean
        default: false

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies (pnpm audit + OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      # Fails on high / critical advisories in production dependencies.
      - name: pnpm audit (prod, high and up)
        run: pnpm audit --prod --audit-level=high
      # Full lockfile (dev tools included), as a report: dev-only moderate/low advisories do not fail the build.
      - name: OSV-Scanner (report)
        continue-on-error: true
        run: docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner:v1.9.2 scan source --lockfile /src/pnpm-lock.yaml

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Production dependencies only; `pnpm licenses list` reads the installed packages.
      - run: pnpm install --frozen-lockfile --prod --ignore-scripts
      # Fails on GPL/AGPL/LGPL/SSPL/BSL/FSL/unknown licenses not in scripts/license-policy.json "exceptions";
      # warns (does not fail) when THIRD-PARTY-NOTICES.md is stale (`pnpm licenses:notices`).
      - name: License policy
        run: node scripts/check-licenses.mjs --check-notices

  semgrep:
    name: Semgrep (fail on ERROR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.180.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: semgrep scan
        run: >-
          semgrep scan --metrics=off --error --severity ERROR
          --config p/default --config p/typescript --config p/nodejs --config p/secrets --config p/owasp-top-ten
          --exclude node_modules --exclude dist
          apps packages

  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # .gitleaks.toml = the default rules + verified false positives only.
      - name: gitleaks git
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="*"
          zricethezav/gitleaks:v8.30.1
          git /repo --redact --no-banner --config /repo/.gitleaks.toml

  zap-baseline:
    name: ZAP baseline (staging, passive)
    # The target is the repository variable ZAP_TARGET_URL (your staging deployment); unset = the job is skipped.
    if: github.event_name == 'workflow_dispatch' && inputs.zap && vars.ZAP_TARGET_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: zap-baseline.py
        env:
          TARGET: ${{ vars.ZAP_TARGET_URL }}
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.15.0 \
            zap-baseline.py -t "$TARGET" -r zap.html -J zap.json -I
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: zap-baseline
          path: zap/
