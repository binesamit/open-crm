# A release: on a version tag (v1.2.3) build the production image from docker/Dockerfile and publish it to the
# GitHub Container Registry of this repository (ghcr.io/binesamit/open-crm:1.2.3, :1.2, :latest), with a GitHub release
# that carries the install line. Nothing runs on a push to a branch; the image people install is always a tagged one.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (v1.2.3); must exist'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: meta
        name: Image names and tags
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: GitHub release with the install line
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Install or update in one line (an embedded database and file storage in the `bines_data` volume):

            ```sh
            docker run -d --name bines-os -p 3000:3000 -v bines_data:/data --restart unless-stopped \
              ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
            ```

            Then open http://localhost:3000 and create the owner account. Production setup (PostgreSQL, S3, a domain
            with HTTPS): `docs/SELF-HOSTING.md`.
