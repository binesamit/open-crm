<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>Bines — הגדרות</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <h1>Bines — פאנל צד</h1>
    <label
      >כתובת הפאנל (ב-Bines: תוספות › "פאנל דפדפן" › העתקה)
      <input id="panel" dir="ltr" placeholder="https://os.example.com/a/…/x/…/panel" />
    </label>
    <label
      >אתרים שהפאנל קורא את הכתובת שלהם (שורה לכל אתר)
      <textarea id="sites" rows="4" placeholder="https://app.manychat.com"></textarea>
    </label>
    <button id="save">שמור ואשר הרשאות</button>
    <p id="msg" role="status"></p>
    <script type="module" src="options.js"></script>
  </body>
</html>
